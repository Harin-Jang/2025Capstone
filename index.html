<!DOCTYPE html>
<html>
    <head>
        <title>회원가입</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="Login.css">
    </head>
    <body style="background-color: #f8fef3;">
        <div id="signup">
            <div id="mem_title">
                <img src="title_icon.png" style="width: 24px;">
                <span style="margin-left: 4px;">회원가입</span>
            </div>

        <form id="signupForm">
            <ul id="mem_form">
                <li class="row">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">아이디</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li>
                                    <input type="text" name="username" id="username" minlength="5" maxlength="10" pattern="[a-zA-Z0-9]+" required>
                                </li>
                                <!--<li>
                                    <button class="duplication-button" type="button" onclick="alert('클릭')">중복확인</button>
                                </li>-->
                                <li style="margin-left: 4px;">영문, 숫자 조합으로 5~10자 이내</li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li class="row">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">비밀번호</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li>
                                    <input type="password" name="password" id="password" minlength="5" maxlength="10" required>
                                    <li style="margin-left: 4px;">영문, 숫자 조합으로 5~10자 이내</li>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li class="row">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">비밀번호 확인</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li>
                                    <input type="password" id="password2" required>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li class="row" id="name">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">이름</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li>
                                    <input type="text" name="name" id="nameInput" required>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li class="row" id="birthday">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">생년월일</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li>
                                    <input style="width: 100px;" type="text" name="birth" id="birth" pattern="[0-9]{6}" placeholder="YYMMDD" required>
                                    <li style="margin-left: 4px;">주민등록번호 앞 6자리</li>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li class="row" id="email">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">이메일</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li>
                                    <input type="email" name="email" id="emailInput" required>
                                </li>
                            </ul>
                        </li>    
                    </ul>
                </li>
                <li class="row">
                    <ul class="item">
                        <li class="col1">
                            <span style="margin-left: 4px;">휴대전화</span>
                        </li>
                        <li class="col2">
                            <ul>
                                <li><input style="width: 30px;" type="text" id="phone1" pattern="[0-9]{2,3}" required></li>
                                <li>-</li>
                                <li><input style="width: 40px;" type="text" id="phone2" pattern="[0-9]{3,4}" required></li>
                                <li>-</li>
                                <li><input style="width: 40px;" type="text" id="phone3" pattern="[0-9]{4}" required></li>
                            </ul>
                        </li>
                    </ul>
                </li>
            <!-- mem_form -->
            <div id="buttons">
                <button type="submit" id="btnSignup"> 
                    <img style="margin-right: 4px; width: 24px;" src="check_icon.png">
                    가입하기
                </button>
                <div id="msg" style="margin-top:8px;color:#d00;"></div>
            </div>
        </form>
        </div>

        <!-- 가입 요청 JS -->
        <script>
        const form = document.getElementById('signupForm'); 
        const msg  = document.getElementById('msg');        

        form.addEventListener('submit', async (e)=>{         
          e.preventDefault();
          msg.textContent = '';

          const pw  = document.getElementById('password').value;
          const pw2 = document.getElementById('password2').value;
          if(pw !== pw2){ msg.textContent='비밀번호가 일치하지 않습니다.'; return; }

          const body = {
            username: document.getElementById('username').value.trim(),
            password: pw,
            name:     document.getElementById('nameInput').value.trim(),
            birth:    document.getElementById('birth').value.trim(),
            email:    document.getElementById('emailInput').value.trim(),
            phone:    [phone1.value, phone2.value, phone3.value].join('-')
          };

          try{
            // 서버 API로 POST
            const res = await fetch('/api/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data?.error || '가입에 실패했습니다.');

            alert(`가입 완료!\n매핑ID: ${data.asciiMapId}\n체인 tx: ${data.txId}`);
            // TODO: 여기서 로그인 페이지 또는 EXE 로그인 화면으로 이동
            // location.href = '/login';
          }catch(err){
            msg.textContent = err.message;
          }
        });
        </script>
            <script>
      document.addEventListener('DOMContentLoaded', ()=>{
        const form = document.getElementById('signupForm');
        const msg  = document.getElementById('msg');

        form.addEventListener('submit', async (e)=>{
          e.preventDefault();               // 새로고침 방지
          msg.textContent = '';

          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;
          const password2= document.getElementById('password2').value;
          const name     = document.getElementById('nameInput').value.trim();
          const birth    = document.getElementById('birth').value.trim();
          const email    = document.getElementById('emailInput').value.trim();
          const p1 = document.getElementById('phone1').value;   // ← 변수 정의
          const p2 = document.getElementById('phone2').value;
          const p3 = document.getElementById('phone3').value;

          if (password !== password2){
            msg.textContent = '비밀번호가 일치하지 않습니다.'; 
            return;
          }

          const body = { username, password, name, birth, email, phone: [p1,p2,p3].join('-') };

          try{
            // 개발용: 절대경로로 API 호출 (Flask 서버 주소)
            const res = await fetch('http://127.0.0.1:5000/api/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await res.json().catch(()=> ({}));
            if (!res.ok) throw new Error(data?.error || `가입 실패 (HTTP ${res.status})`);

            alert(`가입 완료!\n매핑ID: ${data.asciiMapId}\n체인 tx: ${data.txId}`);
            // location.href = '/login';
          }catch(err){
            console.error(err);
            msg.textContent = err.message || '네트워크 오류';
          }
        });
      });
    </script>
    </body>
</html>
